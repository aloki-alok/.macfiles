<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">How Ryu's Mac fits together</title>
  <desc id="desc">The macfiles repo supplies Home Manager and nix-darwin. These configure the daily workspace: Herdr, the shell, Kage and Kage Stack.</desc>
  <rect width="720" height="300" rx="16" fill="#f5f3ed"/>
  <g fill="none" stroke="#6f7569" stroke-width="2">
    <path d="M360 68v25H180v25m180-25h180v25M180 173v32h180v25m180-57v32H360"/>
  </g>
  <g fill="#ffffff" stroke="#c8cec0">
    <rect x="230" y="20" width="260" height="48" rx="8"/>
    <rect x="40" y="118" width="280" height="55" rx="8"/>
    <rect x="400" y="118" width="280" height="55" rx="8"/>
    <rect x="110" y="230" width="500" height="48" rx="8"/>
  </g>
  <g fill="#28372b" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="360" y="50" font-size="20" font-weight="650">.macfiles</text>
    <text x="180" y="141" font-size="17" font-weight="600">Home Manager</text>
    <text x="180" y="161" font-size="13">Tools · config · fonts</text>
    <text x="540" y="141" font-size="17" font-weight="600">nix-darwin</text>
    <text x="540" y="161" font-size="13">macOS · Homebrew apps</text>
    <text x="360" y="260" font-size="17">Herdr · shell · Kage · Kage Stack</text>
  </g>
</svg>
