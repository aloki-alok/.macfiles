# ~/.aerospace.toml
# Use Option for window shortcuts. Leave arrows and Backspace to apps.

config-version = 2
start-at-login = true
auto-reload-config = true
# A Cmd-H hidden app drops out of tiling and breaks workspace switches, so unhide it.
automatically-unhide-macos-hidden-apps = true

# Version 2 keeps an empty workspace alive only if it is listed here.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# Normalizations keep the tree tidy.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout for new windows.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # wide screen -> horizontal, tall -> vertical

# Keyboard focus pulls the pointer along, but only when it sits outside the focused window.
on-focus-changed = ['move-mouse window-lazy-center']

# Gaps between windows and screen edges.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]

# Focus windows. Add Shift to move the window instead.
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move focused window to a workspace and follow it.
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-tab = 'workspace-back-and-forth'

# Layout and size
alt-f = 'fullscreen'
alt-v = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-shift-semicolon = 'flatten-workspace-tree'   # undo messy nesting

# New windows of these apps open on a fixed workspace.
[[on-window-detected]]
if.app-id = 'dev.herdr.app'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'

# Small utility windows float instead of squeezing the tiles.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.p0deje.Maccy'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.electron.wispr-flow'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = ' Info$'
run = 'layout floating'
