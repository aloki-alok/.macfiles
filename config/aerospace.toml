# ~/.aerospace.toml
# i3-style tiling WM. Main modifier is alt (option). Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2
start-at-login = true
auto-reload-config = true

# Version 2 keeps an empty workspace alive only if it is listed here.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# Normalizations keep the tree tidy.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout for new windows.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # wide screen -> horizontal, tall -> vertical

# Gaps between windows and screen edges.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# ---------------- main mode ----------------
[mode.main.binding]

# Hyprland-style app shortcuts. Keep Command letter shortcuts for macOS apps.
alt-q = 'exec-and-forget open -a Herdr'
alt-c = 'close'
alt-e = 'exec-and-forget open -a Finder'

# Layout toggles
alt-slash = 'layout tiles horizontal vertical'      # cycle tiling orientation
alt-comma = 'layout accordion horizontal vertical'  # accordion (stacked) layout

# Focus panes (vi keys)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Nest: put the focused window in one container with its neighbor (Hyprland-style splits)
alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move focused window to a workspace and follow it.
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

# Jump back to the previous workspace
alt-tab = 'workspace-back-and-forth'

# Toggle fullscreen for the focused window
alt-f = 'fullscreen'

# Float / tile the focused window
alt-shift-space = 'layout floating tiling'
alt-v = 'layout floating tiling'

# Enter "service" mode for less-common actions (reload config, reset layout)
alt-shift-semicolon = 'mode service'

# ---------------- service mode ----------------
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']   # reset layout
b = ['balance-sizes', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Workspace shortcuts also leave service mode, so navigation never gets trapped.
alt-1 = ['mode main', 'workspace 1']
alt-2 = ['mode main', 'workspace 2']
alt-3 = ['mode main', 'workspace 3']
alt-4 = ['mode main', 'workspace 4']
alt-5 = ['mode main', 'workspace 5']
alt-6 = ['mode main', 'workspace 6']
alt-7 = ['mode main', 'workspace 7']
alt-8 = ['mode main', 'workspace 8']
alt-9 = ['mode main', 'workspace 9']
