"$schema" = "https://starship.rs/config-schema.json"

# Tokyo Night, two lines: where you are and Git state on top, input below.
# Git state and command duration appear only when they have something to say.
palette = "tokyonight"
add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[palettes.tokyonight]
fg = "#c0caf5"
comment = "#565f89"
blue = "#7aa2f7"
magenta = "#bb9af7"
green = "#9ece6a"
red = "#f7768e"
yellow = "#e0af68"

[directory]
style = "bold fg"
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " ro"
read_only_style = "red"

[git_branch]
symbol = ""
style = "magenta"
format = "  [$symbol$branch]($style)"

[git_status]
style = "comment"
format = "[ $all_status$ahead_behind]($style)"
conflicted = "x${count} "
ahead = "+${count} "
behind = "-${count} "
diverged = "+${ahead_count}/-${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "*${count} "
modified = "~${count} "
staged = "+${count} "
renamed = ">${count} "
deleted = "-${count} "

[cmd_duration]
min_time = 1_500
style = "yellow"
format = "[ · $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[×](bold red)"
vimcmd_symbol = "[❮](bold blue)"

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true
