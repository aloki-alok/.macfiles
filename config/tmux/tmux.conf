# ~/.config/tmux/tmux.conf  (Mac, parity with iris)
# vi/nvim, mouse-friendly. Clipboard via pbcopy (macOS-native).

# ── prefix ──────────────────────────────────────────────────────────
# default Ctrl-b (Ctrl-a would shadow zsh "beginning of line")

# ── general ─────────────────────────────────────────────────────────
# Plugin scripts call `tmux`, which lives in /opt/homebrew/bin. A server started by
# iTerm2 or launchd gets a bare PATH, and then every save fails with 127.
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set  -g mouse on
set -sg escape-time 10                 # no lag dropping into nvim normal mode
set  -g history-limit 50000
set  -g base-index 1                   # windows start at 1
setw -g pane-base-index 1
set  -g renumber-windows on            # keep window numbers gapless
set  -g focus-events on
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # truecolor in iTerm2
set -as terminal-features ",xterm*:cstyle"          # nvim cursor shape (bar in insert)
set -s  set-clipboard on                            # OSC 52: nvim and ssh copy reach the Mac clipboard
set  -g allow-passthrough on                        # imgcat and notifications reach iTerm2
set  -g detach-on-destroy off          # closing a session's last pane jumps to another session, not out of tmux
setw -g aggressive-resize on           # two iTerm2 windows on different sessions each get full size
setw -g automatic-rename-format "#{b:pane_current_path}"   # tabs named by folder, so five claude tabs stay tellable

# ── popups (omerxx floax / Prime sessionizer ideas, built-in display-popup) ──
bind f display-popup -E -w 60% -h 60% "~/.config/tmux/tmux-session-picker.sh"   # iTerm2 Cmd+P sends this
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind s choose-tree -Zs                 # session list, zoomed

# ── splits ──────────────────────────────────────────────────────────
# vertical split (side by side) -> prefix |   horizontal (stacked) -> prefix -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── pane navigation ─────────────────────────────────────────────────
# In nvim the key goes to vim-tmux-navigator, which moves splits and hands back at the edge.
bind -n M-h if -F "#{m/r:^n?vim$,#{pane_current_command}}" "send M-h" "select-pane -L"
bind -n M-j if -F "#{m/r:^n?vim$,#{pane_current_command}}" "send M-j" "select-pane -D"
bind -n M-k if -F "#{m/r:^n?vim$,#{pane_current_command}}" "send M-k" "select-pane -U"
bind -n M-l if -F "#{m/r:^n?vim$,#{pane_current_command}}" "send M-l" "select-pane -R"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── pane resize (prefix + HJKL, hold to repeat) ─────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── windows (tabs) ──────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -n M-, previous-window
bind -n M-. next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

bind O select-pane -t :.-               # previous pane (o is next); iTerm2 Cmd+[ sends this
bind C-k send-keys -R C-l \; clear-history # clear screen and scrollback; iTerm2 Cmd+K sends this. -R first, else the cleared screen lands in history

# ── closing ─────────────────────────────────────────────────────────
# prefix x  : close pane (asks y/n)    prefix &  : close window

# ── vi copy mode; y / drag copy to the macOS clipboard ──────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 2 scroll-up     # default 5 lines per tick jumps on a trackpad
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 2 scroll-down
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"   # copy but stay scrolled; q or Esc leaves

# ── reload this file ────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── status bar: Tokyo Night pills (other designs sit next to it) ────
# Must load before tpm: continuum prepends its auto-save hook to status-right.
source-file ~/.config/tmux/status/b-pills.conf

# ── restore after reboot ────────────────────────────────────────────
# continuum saves every 15 min and restores when the tmux server starts.
# Manual: prefix C-s save, prefix C-r restore. Saves live in ~/.local/share/tmux/resurrect.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh btop "~claude->claude --continue"'
set -g @continuum-restore 'on'
# Leave kage out of saves: a restored empty kage session makes ~/kage/start.sh think Kage is running, so it never starts.
set -g @resurrect-hook-post-save-all '~/.config/tmux/resurrect-drop-kage.sh'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
run '~/.tmux/plugins/tpm/tpm'                # keep last: continuum hooks status-right
