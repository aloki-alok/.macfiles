# Shared by every variant: reset, Tokyo Night pane borders, prefix and zoom flags.
set -g status on
set -gu status-format
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g status-interval 5
setw -g window-status-separator ""
set -g pane-border-lines single
set -g pane-border-style        "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style         "bg=default,fg=#c0caf5"
set -g message-command-style "bg=default,fg=#c0caf5"
setw -g window-status-current-style default   # tmux 3.8 default underlines the active tab
set -g mode-style    "bg=#283457,fg=#c0caf5"
