# A. Quiet line: no background, text only. The bar reads as part of the terminal.
source-file -F "#{d:current_file}/base.conf"
set  -g status-style "bg=default,fg=#565f89"
set  -g status-left  "#{?client_prefix,#[fg=#ff9e64 bold],#[fg=#7aa2f7 bold]}#S #[default]  "
setw -g window-status-format         "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#c0caf5,bold] #I #W#{?window_zoomed_flag, #[fg=#e0af68]zoom,} "
set  -g status-right "#[fg=#565f89]#{b:pane_current_path}   %H:%M "
