# B. Pills: rounded Nerd Font caps, the catppuccin-tmux look in Tokyo Night colors.
source-file -F "#{d:current_file}/base.conf"
set  -g status-style "bg=default,fg=#a9b1d6"
set  -g status-left  "#{?client_prefix,#[fg=#ff9e64],#[fg=#7aa2f7]}#{?client_prefix,#[bg=#ff9e64],#[bg=#7aa2f7]}#[fg=#1a1b26 bold] #S #[bg=default nobold]#{?client_prefix,#[fg=#ff9e64],#[fg=#7aa2f7]}#[default]  "
setw -g window-status-format         "#[fg=#565f89] #I #W  "
setw -g window-status-current-format "#[fg=#292e42]#[bg=#292e42 fg=#bb9af7 bold]#I #[fg=#c0caf5]#W#{?window_zoomed_flag, #[fg=#e0af68]󰊓,}#[bg=default fg=#292e42 nobold] "
set  -g status-right "#[fg=#292e42]#[bg=#292e42 fg=#7dcfff] #[fg=#c0caf5]#{b:pane_current_path}#[bg=default fg=#292e42] #[fg=#292e42]#[bg=#292e42 fg=#9ece6a]󰥔 #[fg=#c0caf5]%H:%M#[bg=default fg=#292e42]"

# Close prompts as red pills instead of a full-width bar.
bind x confirm-before -p "#[fg=#f7768e]#[bg=#f7768e fg=#1a1b26 bold] close pane #P? #[bg=default fg=#f7768e nobold]#[default] y/n " kill-pane
bind & confirm-before -p "#[fg=#f7768e]#[bg=#f7768e fg=#1a1b26 bold] close tab #W? #[bg=default fg=#f7768e nobold]#[default] y/n " kill-window
