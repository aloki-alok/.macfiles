# D. Quiet line plus a hint line that changes with the mode (Zellij idea):
# normal mode shows the Cmd keys, prefix mode shows what each next key does.
source-file -F "#{d:current_file}/a-quiet.conf"
set -g status 2
set -g status-format[1] "#[align=centre]#{?client_prefix,#[fg=#ff9e64 bold]PREFIX #[fg=#565f89 nobold]  #[fg=#c0caf5]|#[fg=#565f89] split   #[fg=#c0caf5]-#[fg=#565f89] stack   #[fg=#c0caf5]c#[fg=#565f89] tab   #[fg=#c0caf5]z#[fg=#565f89] zoom   #[fg=#c0caf5]x#[fg=#565f89] close   #[fg=#c0caf5]C-s#[fg=#565f89] save   #[fg=#c0caf5]d#[fg=#565f89] detach,#[fg=#3b4261]#[fg=#a9b1d6]⌘D#[fg=#3b4261] split   #[fg=#a9b1d6]⌘⇧D#[fg=#3b4261] stack   #[fg=#a9b1d6]⌘T#[fg=#3b4261] tab   #[fg=#a9b1d6]⌘⌥←→#[fg=#3b4261] move   #[fg=#a9b1d6]⌘⇧↵#[fg=#3b4261] zoom   #[fg=#a9b1d6]⌘W#[fg=#3b4261] close}"
