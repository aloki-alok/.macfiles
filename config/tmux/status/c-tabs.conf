# C. Tab strip on top: the active tab shares the pane background, so it reads as a real tab.
# Right side is a mode flag (Zellij idea): empty normally, PREFIX or ZOOM when on.
source-file -F "#{d:current_file}/base.conf"
set  -g status-position top
set  -g status-style "bg=#16161e,fg=#565f89"
set  -g status-left  "#[fg=#7aa2f7,bold]  #S  "
setw -g window-status-format         "#[fg=#565f89]  #I  #W  "
setw -g window-status-current-format "#[bg=#1a1b26,fg=#7aa2f7,bold]▎#[fg=#c0caf5] #I  #W  "
set  -g status-right "#{?window_zoomed_flag,#[bg=#e0af68 fg=#16161e bold] ZOOM #[default] ,}#{?client_prefix,#[bg=#ff9e64 fg=#16161e bold] PREFIX ,#[fg=#565f89]%H:%M  }"
